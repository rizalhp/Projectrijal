name: Banking Analytics CI

on:
  push:
    paths:
      - 'banking-customer-analytics/**'
      - '.github/workflows/banking-analytics-ci.yml'
  pull_request:
    paths:
      - 'banking-customer-analytics/**'
      - '.github/workflows/banking-analytics-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banking-customer-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
